# Goes in /etc/nginx/snippets/. The Drupal admin site itself: files, headers, PHP. Included by the HTTPS server
# of each admin address (cms.bible-and-beyond.com in cms.bible-and-beyond.com.conf, cms.freestudy.bible in
# cms.freestudy.bible.conf), so the two never drift apart.

root /home/paul/bible-and-beyond.com/drupal/web;
index index.php;
# A song or video of the Christian music section can be up to 1 GB (with the rest of the form).
client_max_body_size 1040m;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Always HTTPS (a year). Drupal sends its own X-Frame-Options.
add_header Strict-Transport-Security "max-age=31536000" always;

# Certificate authorities check files here to prove we control the domain.
location /.well-known/pki-validation/ {
  alias /var/www/pki-validation/;
  default_type text/plain;
}

# Hidden files, Composer files, and anything inside vendor are never served.
location ~ /\.(?!well-known) { deny all; }
location ~ ^/(vendor|\.git)(/|$) { deny all; }
location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|xtmpl)$ { return 404; }
location ~ ^/(composer\.(json|lock)|package\.json|yarn\.lock|web\.config)$ { return 404; }
location ~ ^/sites/[^/]+/(private|settings|services)  { deny all; }
# Drupal's own CHANGELOG.txt, INSTALL.txt, README.md ... say which version runs: not served (robots.txt is).
location ~ ^/(core/)?[A-Z][A-Za-z0-9._-]*\.(txt|md)$ { return 404; }

# Uploaded files are served as plain files, never run as PHP.
location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; }
location ~ ^/sites/[^/]+/files/styles/ { try_files $uri /index.php?$query_string; }

# Slow down password guessing on the login page.
location = /user/login {
  limit_req zone=cms_login burst=5 nodelay;
  limit_req_status 429;
  try_files $uri /index.php?$query_string;
}

location / {
  try_files $uri /index.php?$query_string;
}

# Only Drupal's front controller and update script run as PHP.
location ~ ^/(index|update)\.php(/|$) {
  fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
  include fastcgi_params;
  fastcgi_param HTTP_PROXY "";
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param PATH_INFO $fastcgi_path_info;
  fastcgi_param QUERY_STRING $query_string;
  fastcgi_intercept_errors on;
  # Long enough for a PDF or Word upload, whose scanned pages are read by text recognition (BibleManager
  # allows a document 600 s).
  fastcgi_read_timeout 620s;
  fastcgi_pass unix:/run/php/bible-and-beyond-fpm.sock;
  # Drupal names itself in X-Generator; there is no need to tell anyone.
  fastcgi_hide_header X-Generator;
}
location ~ \.php$ { return 404; }

# Captions (.vtt) as text/vtt: the stock MIME list lacks them, and Firefox shows no captions served otherwise.
# A types block here replaces the list only for these files; no add_header, so the server's headers still apply.
location ~* \.vtt$ {
  types { text/vtt vtt; }
  try_files $uri =404;
}

location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
  try_files $uri /index.php?$query_string;
  expires 30d;
  access_log off;
}
