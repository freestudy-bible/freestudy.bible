# Goes in /etc/nginx/sites-available/cms.freestudy.bible. install-system-config.sh links it into sites-enabled/
# only once its certificate exists (nginx will not start with a missing certificate file).
#
# The Drupal admin at https://cms.freestudy.bible: the same Drupal as cms.bible-and-beyond.com, under the
# freestudy.bible name. HTTPS certificate: bought from Namecheap, installed by hand. Files:
#   /etc/ssl/bible-and-beyond/cms.freestudy.bible.fullchain.crt  (certificate + CA bundle)
#   /etc/ssl/private/cms.freestudy.bible.key                     (private key, root only)
# Drupal must also trust the name: trusted_host_patterns in settings.local.php.

# Plain HTTP: serve certificate validation files, send everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name cms.freestudy.bible www.cms.freestudy.bible;

  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
    default_type text/plain;
  }

  location / {
    return 301 https://cms.freestudy.bible$request_uri;
  }
}

# www.cms goes to the main admin address.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.cms.freestudy.bible;
  include snippets/cms-freestudy-ssl.conf;

  return 301 https://cms.freestudy.bible$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cms.freestudy.bible;
  include snippets/cms-freestudy-ssl.conf;

  include snippets/cms-app.conf;
}
